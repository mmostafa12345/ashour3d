<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="theme-color" content="#060606">
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700&display=swap" rel="stylesheet">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>آشور للطباعة ثلاثية الأبعاد | المعرض</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:dark;--bg:#060606;--card:#121110;--tx:#f3ead7;--mut:#a89a7e;--ac:#c9a15b;--ac2:#1a1306;--bd:#2c2418;--gold:linear-gradient(135deg,#e8c987,#b88a3e 55%,#d9b068)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Cairo","Segoe UI",Tahoma,Arial,sans-serif;padding-bottom:90px;background-image:radial-gradient(ellipse at top,#16120a,transparent 60%)}
header{padding:18px 16px 6px;text-align:center}
.logo{width:min(260px,62vw);display:block;margin:0 auto;-webkit-mask-image:radial-gradient(closest-side,#000 82%,transparent 100%);mask-image:radial-gradient(closest-side,#000 82%,transparent 100%)}
h1{margin:0;font-size:1.15rem;font-weight:600;color:var(--ac)}
header p{margin:6px 0 0;color:var(--mut);font-size:.95rem}
.sep{height:1px;max-width:260px;margin:14px auto 0;background:linear-gradient(90deg,transparent,var(--ac),transparent)}
footer{text-align:center;color:var(--mut);font-size:.85rem;padding:20px 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;padding:16px;max-width:1000px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;overflow:hidden;cursor:pointer;transition:border-color .2s,transform .2s}.card:hover{border-color:var(--ac);transform:translateY(-2px)}
.card img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.card .i{padding:10px}
.card b{display:block;margin-bottom:4px}
.price{color:var(--ac);font-weight:700}
h2{color:var(--ac)}
.sel{outline:2px solid var(--ac)}
button{font:inherit;cursor:pointer;border:0;border-radius:10px;padding:10px 16px;background:var(--gold);color:var(--ac2);font-weight:700}
button.g{background:transparent;color:var(--ac);border:1px solid var(--ac)}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.78);display:none;align-items:flex-end;justify-content:center;z-index:20}
.modal.on{display:flex}
.sheet{background:var(--card);border:1px solid var(--bd);width:100%;max-width:560px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:18px;max-width:720px;display:grid;grid-template-columns:1fr 1fr;gap:0 18px;align-content:start}.sheet>.main,.sheet>.th{grid-column:1}.sheet>.main{grid-row:1}.sheet>h2,.sheet>p,.sheet>table,.sheet>div:last-child{grid-column:2}.grid{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}.bar{padding-left:max(16px,calc(50% - 500px));padding-right:max(16px,calc(50% - 500px))}}
.main{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px}
.th{display:flex;gap:8px;margin:8px 0;overflow-x:auto}
.th img{width:64px;height:64px;object-fit:cover;border-radius:8px;cursor:pointer;border:2px solid transparent}
.th img.a{border-color:var(--ac)}
table{width:100%;border-collapse:collapse;margin:10px 0}
td{padding:7px 0;border-bottom:1px solid var(--bd)}
td:last-child{text-align:left;font-weight:600}
.bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px calc(12px + env(safe-area-inset-bottom,0px));background:var(--card);border-top:1px solid var(--bd);display:none;align-items:center;justify-content:space-between;gap:10px;z-index:10}
.bar.on{display:flex}
.list{margin:8px 0}
.list div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--bd)}
input{width:100%;font:inherit;padding:10px;border-radius:10px;border:1px solid var(--bd);background:var(--bg);color:var(--tx);margin:6px 0}
.box{border:1px solid var(--bd);border-radius:12px;padding:12px;margin:12px 0 0}
.box small{color:var(--mut)}
.dims{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:10px 0 4px}
.dims label{font-size:.8rem;color:var(--mut)}
.dims input{margin:4px 0 0;text-align:center}
input[type=range]{accent-color:var(--ac);padding:0;border:0;margin:8px 0 2px}
.rg{display:flex;justify-content:space-between;font-size:.78rem;color:var(--mut)}
.rg #pc{color:var(--ac);font-weight:700}
.qb{padding:2px 10px;font-size:1rem}
.list small{font-size:.8rem}
</style>
</head>

var cart=[], cur=null;
function $(i){return document.getElementById(i)}
function fmt(n){return Math.round(n).toLocaleString("en-US")+" د.ع"}
function nf(x){return String(Math.round(x*10)/10)}
function maxS(p){return MAX_DIM/Math.max.apply(null,p.dims)}
function P(id){return PRODUCTS.find(function(x){return x.id===id})}
function est(p,s){var g=p.grams*Math.pow(s,p.exp||3);return {g:g,pr:Math.round(g*PRICE_PER_GRAM/ROUND)*ROUND}}
function szs(p,s){return p.dims.map(function(d){return nf(d*s)}).join(" × ")+" سم"}
function ph(p){return "data:image/svg+xml;utf8,"+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200"><rect width="200" height="200" fill="#1a1610"/><rect x="8" y="8" width="184" height="184" fill="none" stroke="#c9a15b" stroke-opacity=".35"/></svg>')}
function imgs(p){return p.images&&p.images.length?p.images:[ph(p)]}
function render(){
 $("grid").innerHTML=PRODUCTS.map(function(p){
  return '<div class="card" onclick="openP('+p.id+')"><img src="'+imgs(p)[0]+'" alt=""><div class="i"><b>'+p.name+'</b><span class="price">'+fmt(est(p,1).pr)+'</span></div></div>'}).join("");
 var n=0,t=0;cart.forEach(function(c){n+=c.q;t+=c.q*est(P(c.id),c.s).pr});
 $("bar").className="bar"+(n?" on":"");
 $("cnt").textContent=n+" قطعة في الطلب";
 $("tot").textContent=fmt(t);
}
function openP(id){
 var p=P(id),im=imgs(p);cur={id:id,s:1};
 var h='<img class="main" id="mi" src="'+im[0]+'" alt="">';
 if(im.length>1)h+='<div class="th">'+im.map(function(s,i){return '<img class="'+(i?'':'a')+'" src="'+s+'" onclick="$(\'mi\').src=this.src;this.parentNode.querySelectorAll(\'img\').forEach(function(e){e.classList.remove(\'a\')});this.classList.add(\'a\')">'}).join("")+'</div>';
 h+='<h2 style="margin:10px 0 4px">'+p.name+'</h2><p style="color:var(--mut);margin:0">'+p.desc+'</p>';
 h+='<div class="box"><b>غيّر الحجم</b><small> — أي بُعد تعدّله تتغير الأبعاد الأخرى بنفس النسبة، والحد الأقصى لأي بُعد '+MAX_DIM+' سم</small><div class="dims">'+
  p.dims.map(function(d,i){return '<label>'+DIMN[i]+' (سم)<input type="number" inputmode="decimal" step="0.1" min="0.1" id="d'+i+'" value="'+d+'" oninput="onDim('+i+',this)" onchange="upd(-1)"></label>'}).join("")+'</div>'+
  '<input type="range" id="sl" min="'+MIN_S*100+'" max="'+Math.floor(maxS(p)*100)+'" step="5" value="100" oninput="cur.s=this.value/100;upd(-1)">'+
  '<div class="rg"><span>'+MIN_S*100+'%</span><span id="pc">100%</span><span>'+Math.floor(maxS(p)*100)+'%</span></div></div>';
 h+='<table><tr><td>القياسات المختارة</td><td id="o1"></td></tr><tr><td>الوزن التقريبي</td><td id="o2"></td></tr><tr><td>السعر</td><td class="price" id="o3"></td></tr></table>';
 h+='<p style="color:var(--mut);font-size:.8rem;margin:0 0 10px">السعر = الوزن بالغرام × '+PRICE_PER_GRAM+' دينار. السعر تقديري ويُؤكَّد عند الطلب.</p>';
 h+='<div style="display:flex;gap:8px"><button style="flex:1" onclick="addC()">إضافة إلى طلبي</button><button class="g" onclick="cur.s=1;upd(-1)">الحجم الأصلي</button><button class="g" onclick="closeM()">إغلاق</button></div>';
 show(h);upd(-1);
}
function upd(skip){
 var p=P(cur.id),s=cur.s;
 p.dims.forEach(function(d,i){if(i!==skip)$("d"+i).value=nf(d*s)});
 $("sl").value=Math.round(s*100);$("pc").textContent=Math.round(s*100)+"%";
 var r=est(p,s);
 $("o1").textContent=szs(p,s);$("o2").textContent=Math.round(r.g)+" غرام";$("o3").textContent=fmt(r.pr);
}
function onDim(i,el){var v=parseFloat(el.value);if(!(v>0))return;var s=v/P(cur.id).dims[i];cur.s=Math.min(maxS(P(cur.id)),Math.max(MIN_S,s));upd(i)}
function show(h){$("sheet").innerHTML=h;$("m").className="modal on"}
function closeM(){$("m").className="modal"}
function addC(){
 var f=cart.find(function(c){return c.id===cur.id&&Math.abs(c.s-cur.s)<0.001});
 if(f)f.q++;else cart.push({id:cur.id,s:cur.s,q:1});
 render();closeM();
}
function q(i,d){cart[i].q+=d;if(cart[i].q<=0)cart.splice(i,1);render();if(cart.length)openOrder();else closeM()}
function openOrder(){
 var t=0,h='<h2 style="margin:0 0 8px">طلبك</h2><div class="list">';
 cart.forEach(function(c,i){var p=P(c.id),s=c.q*est(p,c.s).pr;t+=s;
  h+='<div><span>'+p.name+'<br><small style="color:var(--mut)">'+szs(p,c.s)+'</small></span><span style="text-align:left"><button class="g qb" onclick="q('+i+',-1)">−</button> '+c.q+' <button class="g qb" onclick="q('+i+',1)">+</button><br><b>'+fmt(s)+'</b></span></div>'});
 h+='</div><div class="list"><div><b>المجموع</b><b class="price">'+fmt(t)+'</b></div></div><input id="nm" placeholder="اسمك"><input id="nt" placeholder="ملاحظات (لون، اسم مطلوب...)">';
 h+='<div style="display:flex;gap:8px"><button style="flex:1" onclick="send()">إرسال الطلب عبر واتساب</button><button class="g" onclick="closeM()">رجوع</button></div>';
 show(h);
}
function send(){
 var t=0,l=["طلب جديد من المعرض:"];
 cart.forEach(function(c){var p=P(c.id),s=c.q*est(p,c.s).pr;t+=s;l.push("- "+p.name+" ("+szs(p,c.s)+") × "+c.q+" = "+fmt(s))});
 l.push("المجموع: "+fmt(t));
 var n=$("nm").value,o=$("nt").value;
 if(n)l.push("الاسم: "+n);if(o)l.push("ملاحظات: "+o);
 window.open("https://wa.me/"+WHATSAPP+"?text="+encodeURIComponent(l.join("\n")),"_blank");
}
render();
</script>
